name: Unpack HAxBRO source ZIP
on:
  push:
    paths:
      - ".github/workflows/unpack-haxbro.yml"
      - "haxbro-ai-oybr-code-20261124-1035.zip"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="haxbro-ai-oybr-code-20261124-1035.zip"
          test -s "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          mkdir -p unpacked-haxbro
          unzip -q "$ARCHIVE" -d unpacked-haxbro
          echo "Archive size:"
          du -h "$ARCHIVE"
          echo "Extracted file count:"
          find unpacked-haxbro -type f | wc -l
          echo "Top-level contents:"
          find unpacked-haxbro -mindepth 1 -maxdepth 2 -printf '%y %p\n' | sort | head -200
          printf '%s\n' "ZIP extraction succeeded." > unpacked-haxbro/EXTRACTION-STATUS.txt
      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: haxbro-extracted-source
          path: unpacked-haxbro/
          if-no-files-found: error
          retention-days: 7
